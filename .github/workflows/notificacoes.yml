name: Notificação Android com tela bloqueada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app-mobile/src/services/localNotifications.ts', 'e2e/android-notifications/**', '.github/workflows/notificacoes.yml']
permissions:
  contents: read
jobs:
  alarme:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: app-mobile
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache/restore@v4
        id: app
        with:
          path: app-mobile/android/app/build/outputs/apk/release/app-release.apk
          key: alarme-x86-v1-${{ hashFiles('app-mobile/**', 'e2e/android-notifications/entry.js') }}
      - name: Compilar o teste com o agendador do aplicativo
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          npm ci
          cp ../e2e/android-notifications/entry.js index.js
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/cache/save@v4
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: app-mobile/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.app.outputs.cache-primary-key }}
      - name: Iniciar Android 14 no emulador
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          image='system-images;android-34;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$image" emulator platform-tools
          export ANDROID_USER_HOME="$RUNNER_TEMP/synck-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n synck -k "$image" -p "$ANDROID_AVD_HOME/synck.avd" --device pixel_2 --force
          test -s "$ANDROID_AVD_HOME/synck.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-34\n' "$ANDROID_AVD_HOME/synck.avd" > "$ANDROID_AVD_HOME/synck.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x synck
          "$ANDROID_HOME/emulator/emulator" -avd synck -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -partition-size 2048 -memory 2048 -cores 2 > /tmp/synck-emulator.log 2>&1 &
          timeout 150 adb wait-for-device || { tail -100 /tmp/synck-emulator.log; df -h .; exit 1; }
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done' || { tail -100 /tmp/synck-emulator.log; exit 1; }
          adb shell input keyevent 82
      - name: Verificar entrega depois de fechar e bloquear
        run: bash ../e2e/android-notifications/check.sh
